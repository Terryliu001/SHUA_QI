distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# ── 本机网络限制（2026-10-22 实测）──────────────────────────────────────
# services.gradle.org 会 307 重定向到 github.com/gradle/gradle-distributions/releases，
# 而本机代理对 github.com 稳定返回 502，导致 wrapper 下载必然超时。
# 故改用腾讯云镜像取同一份官方发行版。
# 还原官方地址：把下面的 distributionUrl 换回
#   distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
# 并先清掉旧缓存：rm -rf "$GRADLE_USER_HOME/wrapper/dists/gradle-9.3.1-all"
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-all.zip
