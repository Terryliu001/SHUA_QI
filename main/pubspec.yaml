name: shuaqi
description: "刷起 SHUAQI —— Android 平板刷题工具：PDF 背景 + 手写笔迹层，异步识别，交卷后几何归属与判题。"
publish_to: 'none'

# 版本与构建号。versionCode 由 + 后面的数字提供。
version: 0.1.3+4

environment:
  # 锁定 Dart（随 Flutter 3.47.6 stable）。不要放宽到 <4.0.0，避免未来大版本静默升级。
  sdk: ^3.13.5
  flutter: ">=3.47.6"

# ============================================================================
# 依赖纪律（与规格 §5.3 / §9 一致）
#   1. 只允许白名单内的包；新增即违规，必须先改文档再改代码。
#   2. 一律使用精确版本（不带 ^ / ~），保证任何机器 `flutter pub get` 得到同一份代码。
#   3. 增删依赖后必须把 pubspec.lock 一起提交，并在项目日志里记一行理由。
#   白名单：flutter_riverpod / pdfrx / sqflite / path_provider / path / file_picker /
#           google_mlkit_digital_ink_recognition / onnxruntime / flutter_math_fork /
#           flutter_markdown / flutter_secure_storage / http / archive / crypto /
#           share_plus / device_info_plus
# ============================================================================
dependencies:
  # SIF 的整文件 zlib（T2.4）。纯 Dart，白名单内；锁到 pubspec.lock 已解析的版本。
  archive: 4.5.2
  crypto: 3.0.7
  file_picker: 13.1.0
  flutter:
    sdk: flutter

  # 状态管理（唯一允许的方案，见规格 §9：禁止 get_it / provider 混用）
  flutter_riverpod: 3.4.3
  # 本地存储与路径
  path: 1.9.1
  path_provider: 2.1.6
  sqflite: 2.4.5

  # PDF 渲染（T0.4 已验：首屏 28ms / 翻页 3ms）。
  # ⚠️ 它是 native assets 包：只要在依赖里，宿主机 `flutter test` 就会试图用 MSVC
  # 编译 pdfium 的 gate 库，而本机沙箱禁 reg.exe → 找不到 Windows SDK → 测试整个挂。
  # 所以跑宿主机测试要用 `bash tool/run_tests.sh`（它会临时摘掉本依赖再跑）。
  # 首次构建/换机后要重跑 tool/patch_pdfium_mirror.py（pdfium 从 github 下载，本机不通）。
  pdfrx: 2.9.0
  # 本地手写 OCR（T4.1）。ML Kit 数字墨水：笔画直接识别，模型按语言远程下载；
  # 无 GMS/模型下载失败时引擎 warmUp 返回 false，上层降级（原图仍留存）。
  google_mlkit_digital_ink_recognition: 0.16.1
  # 公式排版（T6.7）：AI 回复与识别文本里的 LaTeX 用 KaTeX 子集离线渲染。
  # 纯 Dart + Flutter，白名单内；钉到已解析版本。
  flutter_math_fork: 0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 在真机上跑测试的 binding（来自 Flutter SDK，不额外下载包）。
  # DB 测试放这里的理由见 integration_test/db_test.dart 顶部注释。
  integration_test:
    sdk: flutter

  # 静态检查规则集（仅开发期需要）。规则清单在 analysis_options.yaml。
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # 资源目录约定：
  #   assets/textures/ 纸感噪点等轻量纹理（T1.6 起）
  #   assets/models/   引擎 B/C 的 ONNX 与字典 —— T0.5 产出后在此声明
  #   demo_assets/     演示试卷 / 截图 / 录屏 —— 不进包，仅供手工测试
  assets:
    - assets/textures/
